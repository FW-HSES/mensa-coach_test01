<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mensa-Coach</title>
<style>
:root{--akzent:#2f7d5b;--akzent-hell:#e6f2ec;--bg:#f4f6f5;--text:#1f2a26;--grau:#6b7a73;--rand:#e1e7e4}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body.tablet,body.handy{background:#cfd6d3}
h1{margin:0;font-size:22px;color:var(--akzent)}
h2{margin:0 0 8px;font-size:20px}
h3{margin:24px 0 12px;font-size:15px;color:var(--grau);text-transform:uppercase;letter-spacing:.05em}
#leiste{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px;background:#1f2a26;color:#fff;font-size:14px}
#rahmen{margin:0 auto;container-type:inline-size;background:var(--bg);min-height:calc(100vh - 54px)}
#rahmen.tablet,#rahmen.handy{margin:24px auto;min-height:700px;border-radius:28px;overflow:hidden;box-shadow:0 0 0 10px #1f2a26,0 12px 40px rgba(0,0,0,.3)}
#rahmen.tablet{max-width:820px}
#rahmen.handy{max-width:390px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 32px;background:#fff;border-bottom:1px solid var(--rand)}
main{display:grid;grid-template-columns:1fr 300px;gap:24px;max-width:1150px;margin:24px auto;padding:0 24px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--rand);background:#fff;border-radius:999px;padding:8px 18px;font-size:14px;cursor:pointer;color:var(--text)}
.seg button.aktiv{background:var(--akzent);border-color:var(--akzent);color:#fff}
#tabs{margin-bottom:20px}
.karte{background:#fff;border:1px solid var(--rand);border-radius:16px;padding:18px}
.karte.gross{background:var(--akzent-hell);border-color:#c9e2d6;padding:26px}
.karte h2{font-size:17px}
.karte.gross h2{font-size:26px}
.label{font-size:12px;font-weight:600;color:var(--akzent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.raster{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--akzent-hell);color:var(--akzent)}
.zeile{font-size:14px;color:var(--grau);margin:4px 0}
.zeile b{color:var(--text)}
.ampel{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:middle}
.gruen{background:#3aa76d}.gelb{background:#e8b730}.rot{background:#d9534f}.grau{background:#b8c2bd}
.klein{font-size:12px;color:var(--grau)}
.knopf{margin-top:16px;border:0;background:var(--akzent);color:#fff;border-radius:12px;padding:10px 20px;font-size:14px;cursor:pointer}
.knopf:hover{opacity:.9}
.hinweis{background:#fff;border:1px dashed var(--rand);border-radius:16px;padding:28px;color:var(--grau);text-align:center}
aside .karte{position:sticky;top:16px}
.check{display:block;margin:8px 0;font-size:14px}
.regler{margin:14px 0}
.regler div{display:flex;justify-content:space-between;font-size:14px}
input[type=range]{width:100%;accent-color:var(--akzent)}
@container (max-width:900px){
  main{grid-template-columns:1fr;gap:16px}
  aside .karte{position:static}
  header{padding:14px 20px}
}
@container (max-width:600px){
  header{flex-direction:column;align-items:flex-start;padding:14px 16px}
  main{padding:0 14px;margin:16px auto}
  .raster{grid-template-columns:1fr}
  .karte.gross{padding:18px}
  .karte.gross h2{font-size:21px}
  #tabs{flex-wrap:nowrap;overflow-x:auto}
}
</style>
</head>
<body>
<div id="leiste"><span>Ansicht:</span><div class="seg" id="ansichten"></div></div>
<div id="rahmen">
<header><h1>Mensa-Coach</h1><div class="seg" id="mensen"></div></header>
<main>
  <section><div class="seg" id="tabs"></div><div id="inhalt"><div class="hinweis">Lade Speiseplan …</div></div></section>
  <aside>
    <div class="karte">
      <h2>Meine Prioritäten</h2>
      <label class="check"><input type="checkbox" id="vegan" onchange="setPrio('vegan',this.checked)"> Nur vegan</label>
      <label class="check"><input type="checkbox" id="vegetarisch" onchange="setPrio('vegetarisch',this.checked)"> Nur vegetarisch</label>
      <div id="regler"></div>
      <p class="klein">0 = egal, 3 = sehr wichtig</p>
    </div>
  </aside>
</main>
</div>
<script>
const MENSEN = {flandernstrasse: "Flandernstraße", stadtmitte: "Stadtmitte"};
const ANSICHTEN = {auto: "Auto", tablet: "Tablet", handy: "Smartphone"};
const STD = {mensa: "flandernstrasse", ansicht: "auto", vegan: false, vegetarisch: false, gesundheit: 2, kalorien: 1, preis: 2, eiweiss: 1};
const REGLER = [["gesundheit", "Gesundheit"], ["kalorien", "Wenig Kalorien"], ["preis", "Niedriger Preis"], ["eiweiss", "Eiweiß"]];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const euro = v => v == null ? "–" : v.toFixed(2).replace(".", ",") + " €";

let prio = ladePrio(), daten = null, tag = null, fehler = null, empfehlung = null;
const besitzer = location.hostname.split(".")[0];
const repo = location.pathname.split("/")[1];

function ladePrio() {
  try { return Object.assign({}, STD, JSON.parse(localStorage.getItem("mensa-prio") || "{}")); }
  catch (e) { return Object.assign({}, STD); }
}
function speichern() { try { localStorage.setItem("mensa-prio", JSON.stringify(prio)); } catch (e) {} }

function init() {
  $("vegan").checked = prio.vegan;
  $("vegetarisch").checked = prio.vegetarisch;
  $("regler").innerHTML = REGLER.map(([k, l]) =>
    `<div class="regler"><div><span>${l}</span><b id="v-${k}">${prio[k]}</b></div>
     <input type="range" min="0" max="3" step="1" value="${prio[k]}" oninput="setPrio('${k}',+this.value)"></div>`).join("");
  laden();
}

async function laden() {
  fehler = null; daten = null; render();
  try {
    if (!location.hostname.endsWith("github.io") || !repo) throw new Error("Bitte die App über ihre GitHub-Pages-Adresse öffnen.");
    const r = await fetch(`https://raw.githubusercontent.com/${besitzer}/${repo}/main/data/${prio.mensa}.json`);
    if (!r.ok) throw new Error("Fehler " + r.status);
    daten = await r.json();
    if (tag === null) {
      const d = new Date(), p = n => String(n).padStart(2, "0");
      const heute = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
      tag = Math.max(0, daten.tage.findIndex(t => t.datum === heute));
    }
  } catch (e) { fehler = e.message; }
  render();
}

function setMensa(m) { prio.mensa = m; speichern(); laden(); }
function setAnsicht(a) { prio.ansicht = a; speichern(); render(); }
function setTag(i) { tag = i; render(); }
function setPrio(k, v) {
  prio[k] = v; speichern();
  if ($("v-" + k)) $("v-" + k).textContent = v;
  renderInhalt();
}

function bewerte(liste) {
  const f = liste.filter(g => !(prio.vegan && !g.vegan) && !(prio.vegetarisch && !g.vegetarisch));
  const wert = {gesundheit: g => g.gesundheit, kalorien: g => g.kcal_portion ?? g.kcal_100g,
                preis: g => g.preis_studierende, eiweiss: g => g.eiweiss_100g};
  const gut = {gesundheit: 1, kalorien: -1, preis: -1, eiweiss: 1};
  const bereich = {};
  for (const k in wert) {
    const vs = f.map(wert[k]).filter(v => v != null);
    bereich[k] = [Math.min(...vs), Math.max(...vs)];
  }
  const norm = (k, g) => {
    const v = wert[k](g), [lo, hi] = bereich[k];
    if (v == null || lo === hi) return 0.5;
    const x = (v - lo) / (hi - lo);
    return gut[k] > 0 ? x : 1 - x;
  };
  const summe = REGLER.reduce((s, [k]) => s + prio[k], 0);
  f.forEach(g => { g.punkte = summe ? REGLER.reduce((s, [k]) => s + prio[k] * norm(k, g), 0) / summe : 0; });
  return f.sort((a, b) => b.punkte - a.punkte || (a.preis_studierende ?? 99) - (b.preis_studierende ?? 99));
}

const ampel = v => v == null ? "grau" : v >= 7 ? "gruen" : v >= 4 ? "gelb" : "rot";

function details(g) {
  const tags = (g.vegan ? '<span class="tag">vegan</span>' : g.vegetarisch ? '<span class="tag">vegetarisch</span>' : "");
  return `<div class="tags">${tags}<span class="tag">${esc(g.kategorie)}</span></div>
    <div class="zeile"><b>${euro(g.preis_studierende)}</b> für Studierende</div>
    <div class="zeile">${g.kcal_100g ?? "–"} kcal und ${g.eiweiss_100g ?? "–"} g Eiweiß pro 100 g</div>
    <div class="zeile">ca. ${g.kcal_portion ?? "–"} kcal pro Portion <span class="klein">(geschätzt)</span></div>
    <div class="zeile"><span class="ampel ${ampel(g.gesundheit)}"></span>Gesundheit ${g.gesundheit ?? "–"}/10 <span class="klein">(geschätzt)</span></div>
    <div class="klein">${esc(g.begruendung || "")}</div>`;
}

function renderInhalt() {
  const el = $("inhalt");
  if (fehler) { el.innerHTML = `<div class="hinweis">Daten konnten nicht geladen werden: ${esc(fehler)}</div>`; return; }
  if (!daten) { el.innerHTML = '<div class="hinweis">Lade Speiseplan …</div>'; return; }
  const t = daten.tage[tag];
  if (!t.gerichte.length) { el.innerHTML = '<div class="hinweis">Für diesen Tag gibt es keine Gerichte (Mensa geschlossen oder Plan noch nicht veröffentlicht).</div>'; return; }
  const liste = bewerte(t.gerichte);
  if (!liste.length) { el.innerHTML = '<div class="hinweis">Kein Gericht passt zu deinen Filtern.</div>'; return; }
  empfehlung = liste[0];
  el.innerHTML = `<div class="karte gross"><div class="label">Tagesempfehlung · ${Math.round(empfehlung.punkte * 100)} Punkte</div>
      <h2>${esc(empfehlung.name)}</h2>${details(empfehlung)}
      <button class="knopf" onclick="teilen()">Per Mail teilen</button></div>
    ${liste.length > 1 ? `<h3>Weitere Gerichte</h3><div class="raster">${liste.slice(1).map(g =>
      `<div class="karte"><h2>${esc(g.name)}</h2>${details(g)}<div class="klein">${Math.round(g.punkte * 100)} Punkte</div></div>`).join("")}</div>` : ""}
    <p class="klein">Stand der Daten: ${esc(daten.stand)}. Gesundheit und Kalorien pro Portion sind KI-Schätzungen.</p>`;
}

function render() {
  $("rahmen").className = prio.ansicht;
  document.body.className = prio.ansicht;
  $("ansichten").innerHTML = Object.entries(ANSICHTEN).map(([k, n]) =>
    `<button class="${k === prio.ansicht ? "aktiv" : ""}" onclick="setAnsicht('${k}')">${n}</button>`).join("");
  $("mensen").innerHTML = Object.entries(MENSEN).map(([k, n]) =>
    `<button class="${k === prio.mensa ? "aktiv" : ""}" onclick="setMensa('${k}')">${n}</button>`).join("");
  $("tabs").innerHTML = daten ? daten.tage.map((t, i) =>
    `<button class="${i === tag ? "aktiv" : ""}" onclick="setTag(${i})">${t.wochentag.slice(0, 2)}</button>`).join("") : "";
  renderInhalt();
}

function teilen() {
  const t = daten.tage[tag], g = empfehlung;
  const betreff = `Mensa-Empfehlung ${MENSEN[prio.mensa]}, ${t.wochentag} ${t.datum}`;
  const text = `Tagesempfehlung Mensa Esslingen ${MENSEN[prio.mensa]} am ${t.wochentag}, ${t.datum}:\n\n${g.name}\n` +
    `Preis: ${euro(g.preis_studierende)}\nca. ${g.kcal_portion ?? "–"} kcal pro Portion (geschätzt)\n` +
    `Gesundheit: ${g.gesundheit ?? "–"}/10 (geschätzt)`;
  location.href = `mailto:?subject=${encodeURIComponent(betreff)}&body=${encodeURIComponent(text)}`;
}

init();
</script>
</body>
</html>
